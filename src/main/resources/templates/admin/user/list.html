<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người dùng</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <header th:replace="~{fragments/common :: topbar}"></header>
    <div class="admin-layout">
        <aside th:replace="~{fragments/common :: sidebar(${activeMenu})}"></aside>
        <main class="main-content">
            <div class="page-heading">
                <div>
                    <h1>Quản lý người dùng</h1>
                </div>
                <a class="btn btn-primary" th:href="@{/admin/users/new}">
                    + Thêm người dùng
                </a>
            </div>

            <div class="alert success"
                 th:if="${success}"
                 th:text="${success}"></div>
            <div class="alert error"
                 th:if="${error}"
                 th:text="${error}"></div>

            <form class="search-box" method="get" th:action="@{/admin/users}">
                <input type="search"
                       name="keyword"
                       th:value="${keyword}"
                       placeholder="Tên đăng nhập, họ tên, email, số điện thoại...">
                <button class="btn btn-primary" type="submit">Tìm kiếm</button>
                <a class="btn btn-light"
                   th:if="${keyword != null and !keyword.isEmpty()}"
                   th:href="@{/admin/users}">Xóa lọc</a>
            </form>

            <div class="card table-wrap wide-table">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên đăng nhập</th>
                            <th>Họ tên</th>
                            <th>Email</th>
                            <th>Điện thoại</th>
                            <th>Vai trò</th>
                            <th>Ngày tạo</th>
                            <th class="actions-col">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}"></td>
                            <td><strong th:text="${user.userName}"></strong></td>
                            <td th:text="${user.fullName}"></td>
                            <td th:text="${user.email}"></td>
                            <td th:text="${user.phone}"></td>
                            <td>
                                <span class="role admin"
                                      th:if="${user.roleid == 1}">Admin</span>
                                <span class="role manager"
                                      th:if="${user.roleid == 2}">Manager</span>
                                <span class="role user"
                                      th:if="${user.roleid == 3}">User</span>
                            </td>
                            <td th:text="${user.createdDate}"></td>
                            <td>
                                <div class="action-group">
                                    <a class="btn btn-warning"
                                       th:href="@{/admin/users/{id}/edit(id=${user.id})}">Sửa</a>
                                    <form method="post"
                                          th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                                          onsubmit="return confirm(
                                              'Bạn có chắc muốn xóa người dùng này?');">
                                        <button class="btn btn-danger" type="submit">Xóa</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="8" class="empty">
                                Không tìm thấy người dùng phù hợp.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
